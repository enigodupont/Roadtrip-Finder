apiVersion: apps/v1\r\nkind: Deployment\r\nmetadata:\r\n  name: roadtripfinder\r\n  labels:\r\n    run: roadtripfinder\r\nspec:\r\n  #Removing as it's controlled by HPA and interrupts ARGO\r\n  replicas: 2\r\n  selector:\r\n    matchLabels:\r\n      run: roadtripfinder\r\n  template:\r\n    metadata:\r\n      labels:\r\n        run: roadtripfinder\r\n    spec:\r\n      affinity:\r\n        # Try to put each pod on a different node in the K8s cluster\r\n        podAntiAffinity:\r\n          preferredDuringSchedulingIgnoredDuringExecution:\r\n            - weight: 100\r\n              podAffinityTerm:\r\n                labelSelector:\r\n                  matchExpressions:\r\n                  - key: run\r\n                    operator: In\r\n                    values:\r\n                      - roadtripfinder\r\n                topologyKey: kubernetes.io/hostname\r\n      containers:\r\n      - name: roadtripfinder\r\n        image: enigodupont/roadtripfinder:default_tag_change_me\r\n        imagePullPolicy: Always \r\n        ports:\r\n        - containerPort: 8080\r\n        resources:\r\n          requests:\r\n            memory: \"256Mi\"\r\n            cpu: \"250m\"\r\n          limits:\r\n            memory: \"512Mi\"\r\n            cpu: \"500m\"\r\n---\r\napiVersion: v1\r\nkind: Service\r\nmetadata:\r\n  name: roadtripfinder\r\nspec:\r\n  selector:\r\n    run: roadtripfinder\r\n  ports:\r\n    - name: roadtripfinder-ui-port\r\n      protocol: TCP\r\n      port: 8080\r\n      targetPort: 8080\r\n  type: ClusterIP\r\n---\r\n#kind: Ingress\r\n#apiVersion: networking.k8s.io/v1\r\n#metadata:\r\n#  name: roadtripfinder\r\n#spec:\r\n#  rules:\r\n#    - host: roadtripfinder.eniworks.net\r\n#      http:\r\n#        paths:\r\n#          - path: /\r\n#            pathType: Prefix\r\n#            backend:\r\n#              service:\r\n#                name: roadtripfinder\r\n#                port:\r\n#                  number: 8080\r\n#---\r\n#apiVersion: autoscaling/v2b